{id:"pt",t:"Língua Portuguesa",n:[
["Interpretação e gêneros","Leia o texto antes das questões e busque a <b>ideia central</b>. Gêneros textuais variam em finalidade (informar, persuadir, instruir). Em inferência, só vale o que o texto permite concluir."],
["Crase","Ocorre com <b>a (preposição) + a (artigo/pronome)</b>. Teste: troque a palavra feminina por uma masculina; se aparecer “ao”, há crase (“Fui ao mercado” → “Fui à feira”). Não há crase antes de verbo, pronome pessoal ou palavra masculina."],
["Concordância e regência","<b>Haver</b> no sentido de existir é impessoal: “Havia problemas”, “Houve erros”. <b>Fazer</b> indicando tempo também: “Faz dois anos”. Regência: <i>assistir</i> (ver) pede “a”; <i>preferir</i> pede “a”."],
["Sintaxe, “que” e “se”","“Que” pode ser pronome relativo (substitui um termo), conjunção integrante (introduz oração substantiva) ou conjunção comparativa/consecutiva. Conjunções: adversativas (mas, porém), concessivas (embora, ainda que), conclusivas (logo, portanto)."],
["Acentuação e pontuação","Não se acentua mais ditongo aberto “ei/oi” em paroxítonas (ideia, heroico). Vírgula nunca separa sujeito de verbo nem verbo de complemento."],
["Colocação pronominal","<b>Próclise</b>: antes do verbo, com palavras negativas, pronomes relativos, advérbios e conjunções subordinativas (“Não me avisou”, “O livro que me deu”). <b>Ênclise</b>: depois do verbo, e nunca no início da frase (“Avisaram-me”). <b>Mesóclise</b>: só no futuro (“Dar-lhe-ei”)."],
["Significação e dicas de prova","Sentido <b>denotativo</b> é o literal; <b>conotativo</b> é o figurado. Sinônimos têm sentido próximo, antônimos têm sentido contrário, e polissemia é a palavra com vários sentidos. Dica: leia o comando antes do texto (“INCORRETA”, “EXCETO”) e desconfie de alternativas com “sempre”, “nunca” e “somente”."]],
q:[["Assinale a alternativa em que o emprego do acento indicativo de crase está correto.",["A reunião começará as 14h.","Encaminhei o relatório à gerente.","O servidor começou à preencher o formulário.","O atendimento ocorre de segunda à sexta."],1,"A forma correta é “à gerente”: ocorre a fusão da preposição exigida pelo verbo com o artigo feminino. Em indicação de horário, usa-se “às 14h”; antes de verbo não ocorre crase; na expressão “de segunda a sexta”, não há artigo antes de sexta."],
["Qual frase está de acordo com a norma-padrão?",["Haviam muitos candidatos.","Houveram vários erros.","Havia muitos candidatos.","Fazem dois anos que estudo."],2,"Haver (existir) e fazer (tempo) são impessoais, ficam no singular."],
["Em “Disse que viria”, o termo “que” é:",["Pronome relativo","Conjunção integrante","Conjunção comparativa","Advérbio"],1,"Introduz a oração objeto direto “que viria”: conjunção integrante."],
["Qual palavra está corretamente grafada/acentuada?",["idéia","ideia","assembléia","heroi"],1,"Pelo Acordo Ortográfico, “ideia” não leva acento."],
["“Embora chovesse, saímos.” A relação entre as orações é de:",["Causa","Conclusão","Concessão","Adição"],2,"“Embora” é conjunção concessiva: ideia contrária que não impede o fato."]]},
{id:"rl",t:"Raciocínio Lógico",n:[
["Porcentagem e frações","x% de N = N · x/100. Aumento de 20% multiplica por 1,2; desconto de 20% multiplica por 0,8."],
["Razão, proporção e regra de três","Regra de três <b>simples direta</b>: grandezas crescem juntas. <b>Inversa</b>: uma cresce, a outra diminui (operários × dias). Na composta, compare cada grandeza com a incógnita."],
["Equação do 1º grau e sistemas","Isole a incógnita fazendo a mesma operação nos dois lados. Em sistemas, use substituição ou adição."],
["Conjuntos","n(A∪B) = n(A) + n(B) − n(A∩B). Comece sempre preenchendo a interseção."],
["Sequências","Teste diferença constante (PA), razão constante (PG), alternância de duas regras e posições de letras."],
["Lógica proposicional","Negação de “todo A é B”: <b>algum A não é B</b>. Negação de “p e q”: <b>não-p ou não-q</b>; de “p ou q”: <b>não-p e não-q</b>. “Se p, então q” equivale a “se não-q, então não-p”, mas <b>não</b> equivale a “se q, então p”."],
["Medidas e médias","1 m³ = 1.000 L; 1 L = 1.000 mL; 1 km = 1.000 m; 1 h = 60 min. Média aritmética = soma ÷ quantidade. Média ponderada = soma de (valor × peso) ÷ soma dos pesos. Problemas de volume e vazão, comuns em saneamento, usam essas conversões."]],
q:[["Quanto é 20% de 350?",["60","70","75","80"],1,"350 × 0,20 = 70."],
["6 operários fazem um muro em 10 dias. Em quantos dias 4 operários, no mesmo ritmo, fariam o mesmo muro?",["6,7","12","15","20"],2,"Inversa: 6 × 10 = 60 operário-dias; 60 ÷ 4 = 15."],
["Qual o próximo termo: 2, 6, 18, 54, …?",["108","160","162","216"],2,"É uma PG de razão 3: 54 × 3 = 162."],
["Se 3x + 5 = 20, então x vale:",["3","5","6","15"],1,"3x = 15 → x = 5."],
["Em uma turma de 30 alunos, 18 estudam inglês, 15 estudam espanhol e 5 estudam ambos. Quantos não estudam nenhum?",["0","2","5","7"],1,"União = 18 + 15 − 5 = 28. Nenhum = 30 − 28 = 2."]]},
{id:"cg",t:"Conhecimentos Gerais e Atualidades",n:[
["História e geografia de SC","Colonização forte de imigrantes alemães (Blumenau, Joinville), italianos e açorianos no litoral (Florianópolis). A Guerra do Contestado (1912–1916) envolveu a disputa de território entre SC e PR."],
["Atualidades","O edital pede: urbanização, política, economia, segurança, saúde, tecnologia, meio ambiente, aquecimento global, relações internacionais e cultura. Revise as manchetes dos últimos 3 meses, principalmente sobre meio ambiente, saneamento e Santa Catarina."],
["Meio ambiente e sustentabilidade","<b>Desenvolvimento sustentável</b>: atender às necessidades atuais sem comprometer as das gerações futuras (Relatório Brundtland). Acordo de Paris: limitar o aquecimento global bem abaixo de 2 °C, buscando 1,5 °C."],

L.es1={t:"ES-1 · Administração Geral e Organizações",cob:"Cobre todos os assuntos do item 1 do Anexo III (Conhecimentos Específicos – Assistente Administrativo).",
sec:[
["1. Explicação completa e didática",`<p>Toda <b>organização</b> é um conjunto de pessoas e recursos (materiais, financeiros, tecnológicos e de informação) que atuam de forma coordenada para alcançar objetivos comuns, que dificilmente seriam atingidos por pessoas isoladas. Quatro marcas centrais: <b>objetivos comuns</b>, <b>divisão do trabalho</b>, <b>coordenação</b> (hierarquia e regras) e <b>relação com o ambiente</b>. As organizações são <b>sistemas abertos</b>: recebem insumos do ambiente (pessoas, dinheiro, matéria-prima, informação), transformam esses insumos em produtos ou serviços e entregam resultados ao ambiente, recebendo retorno (<i>feedback</i>) que permite ajustes.</p>
<p>Quanto à natureza, podem ser públicas, privadas com fins lucrativos ou privadas sem fins lucrativos (terceiro setor). Há também formas mistas: a CASAN é uma <b>sociedade de economia mista</b>, que presta um serviço público essencial (água e esgoto) com regime de empresa e contratação de pessoal pela CLT, como informa o edital.</p>
<p><b>Estrutura organizacional</b> é a maneira como o trabalho é dividido, agrupado e coordenado: quem faz o quê, quem responde a quem e como as áreas se relacionam. É representada pelo <b>organograma</b> e envolve: <b>cadeia de comando</b> (linha de autoridade), <b>unidade de comando</b> (cada pessoa responde a um único superior, na visão clássica), <b>amplitude de controle</b> (quantos subordinados um gestor supervisiona diretamente), <b>centralização</b> (decisões concentradas no topo) ou <b>descentralização</b> (decisões delegadas), <b>especialização</b> e <b>formalização</b> (peso das regras escritas). O agrupamento das atividades em áreas é a <b>departamentalização</b>: funcional (financeiro, RH, jurídico), por produto/serviço, territorial (por região), por clientes, por processos e matricial (combina duas dimensões, como função e projeto). Ao lado da estrutura formal existe a <b>informal</b>: relações sociais espontâneas, grupos e lideranças que surgem no dia a dia e não aparecem no organograma.</p>
<p>O <b>processo administrativo</b> reúne quatro funções interdependentes e cíclicas: <b>planejamento</b> (definir objetivos e o caminho para alcançá-los), <b>organização</b> (dividir o trabalho, estruturar áreas e distribuir recursos e autoridade), <b>direção</b> (liderar, motivar, comunicar e orientar pessoas na execução) e <b>controle</b> (comparar o resultado com o padrão esperado e corrigir desvios). O controle realimenta o planejamento seguinte. Em Fayol, as funções eram prever, organizar, comandar, coordenar e controlar; a síntese moderna mais cobrada é o <b>PODC</b>.</p>
<p>Três conceitos de desempenho que não se confundem: <b>eficiência</b> (fazer certo: usar bem os recursos, obtendo o máximo com o mínimo de insumos, tempo e custo), <b>eficácia</b> (fazer a coisa certa: alcançar os objetivos e metas) e <b>efetividade</b> (o impacto: os resultados geram mudança real e duradoura para a sociedade e os interessados).</p>
<p>Os <b>níveis organizacionais</b> são três: <b>institucional</b> (também chamado estratégico: alta direção, visão global, longo prazo), <b>intermediário</b> (tático: gerências, que traduzem a estratégia em planos por área, médio prazo) e <b>operacional</b> (supervisão e execução, curto prazo, tarefas e rotinas).</p>`],
["2. Conceitos fundamentais",`<ul><li><b>Organização:</b> pessoas e recursos coordenados para objetivos comuns.</li><li><b>Sistema aberto:</b> interage com o ambiente (entradas, transformação, saídas, feedback).</li><li><b>Estrutura formal:</b> a prevista no organograma. <b>Informal:</b> relações espontâneas.</li><li><b>Hierarquia e cadeia de comando:</b> linha de autoridade do topo à base.</li><li><b>Amplitude de controle:</b> número de subordinados diretos de um gestor (não é o número de níveis).</li><li><b>Delegação:</b> transferência de tarefa e da autoridade necessária; a responsabilidade final permanece com quem delegou.</li><li><b>Centralização x descentralização:</b> onde se concentra o poder de decidir.</li><li><b>PODC:</b> planejar, organizar, dirigir e controlar.</li><li><b>Eficiência, eficácia e efetividade:</b> meios, fins e impacto.</li><li><b>Níveis:</b> institucional/estratégico, intermediário/tático e operacional.</li><li><b>Habilidades de Katz:</b> conceituais (mais importantes no topo), humanas (importantes em todos os níveis) e técnicas (mais importantes na base).</li></ul>`],
["3. Exemplos práticos",`<ol><li><b>Eficiência x eficácia (exemplo ilustrativo).</b> Uma companhia de saneamento tinha a meta de substituir 20 km de rede antiga no ano. Substituiu os 20 km (<b>eficaz</b>), mas gastou 30% acima do orçamento (<b>pouco eficiente</b>). No ano seguinte, com melhor programação das equipes, concluiu os 20 km dentro do orçamento (<b>eficaz e eficiente</b>). Se, além disso, as interrupções no fornecimento caírem de forma duradoura, houve <b>efetividade</b>.</li><li><b>Níveis organizacionais.</b> A diretoria decide ampliar o atendimento por esgotamento sanitário nos próximos anos (<b>institucional/estratégico</b>). A gerência regional transforma a decisão em um plano da região, com prioridades e prazos do próximo ano (<b>tático</b>). A equipe administrativa organiza no dia a dia os protocolos, o cadastro das solicitações e o arquivamento (<b>operacional</b>).</li><li><b>Delegação.</b> Uma gerente delega a um assistente o preparo do relatório mensal. Ela transfere a <b>tarefa e a autoridade necessária</b> (acesso aos dados), mas continua <b>responsável pelo resultado</b> perante a diretoria.</li></ol>`],
["4. Aplicações no ambiente administrativo",`<ul><li>Ler o organograma para saber a quem encaminhar um documento ou uma demanda e qual a cadeia de comando, sem ignorar a comunicação informal, que ajuda a resolver problemas.</li><li>Pelo Anexo II, o Assistente Administrativo executa trabalhos de redação, digitação, recepção, expedição e arquivamento de documentos e fornece subsídios para relatórios e processos: atua sobretudo no nível <b>operacional</b>, apoiando decisões táticas com informação organizada.</li><li><b>PODC na rotina:</b> planejar o dia (prioridades e prazos), organizar documentos e materiais, orientar e comunicar com clareza e controlar (conferir se o pedido foi atendido e corrigir falhas).</li><li><b>Eficiência na rotina:</b> evitar retrabalho, padronizar modelos de documentos e usar bem o tempo.</li></ul>`],
["5. Quadros comparativos",`<div class="tbl"><table><tr><th>Conceito</th><th>Pergunta-chave</th><th>Foco</th><th>Exemplo</th></tr><tr><td>Eficiência</td><td>Fizemos certo?</td><td>Meios: custo, tempo, recursos</td><td>Mesmo serviço com menos custo</td></tr><tr><td>Eficácia</td><td>Alcançamos o objetivo?</td><td>Fins: metas cumpridas</td><td>Meta de atendimentos atingida</td></tr><tr><td>Efetividade</td><td>Houve impacto real e duradouro?</td><td>Resultado para a sociedade</td><td>Melhora duradoura na qualidade de vida</td></tr></table></div>
<div class="tbl"><table><tr><th>Nível</th><th>Também chamado</th><th>Horizonte</th><th>Quem atua</th><th>Decisões</th></tr><tr><td>Institucional</td><td>Estratégico</td><td>Longo prazo</td><td>Alta direção</td><td>Rumo da organização, relação com o ambiente</td></tr><tr><td>Intermediário</td><td>Tático</td><td>Médio prazo</td><td>Gerências</td><td>Planos por área</td></tr><tr><td>Operacional</td><td>Operacional</td><td>Curto prazo</td><td>Supervisão e execução</td><td>Tarefas e rotinas</td></tr></table></div>`],
["6. Pontos importantes para memorizar",`<ul><li><b>Eficiência = meios (fazer certo). Eficácia = fins (fazer o certo). Efetividade = impacto.</b></li><li>PODC: Planejar, Organizar, Dirigir, Controlar. O controle volta ao planejamento (ciclo).</li><li>Estrutura informal não está no organograma e coexiste com a formal.</li><li>Amplitude de controle = número de subordinados diretos.</li><li>Delega-se tarefa e autoridade; a responsabilidade final fica com quem delegou.</li><li>Institucional = estratégico; intermediário = tático.</li></ul>`],
["7. Pegadinhas comuns em provas de múltipla escolha",`<p class="mu">São armadilhas frequentes neste tipo de prova, elaboradas por mim para treino. Não são levantamento estatístico da AOCP.</p><ul><li>Trocar <b>eficiência</b> e <b>eficácia</b>: custo e recursos indicam eficiência; meta atingida indica eficácia; impacto duradouro indica efetividade.</li><li>Dizer que a estrutura informal “consta do organograma”.</li><li>Afirmar que o controle só acontece ao final.</li><li>Confundir <b>amplitude de controle</b> com número de níveis hierárquicos.</li><li>Dizer que a delegação transfere toda a responsabilidade.</li><li>Tratar a organização como sistema fechado.</li><li>Classificar o nível pelo cargo e não pelo horizonte e abrangência da decisão.</li></ul>`],
["8. Resumo da matéria",`<p>Organizações são sistemas abertos formados por pessoas e recursos coordenados para objetivos comuns. Sua estrutura (formal e informal) define hierarquia, amplitude de controle, centralização e departamentalização. O processo administrativo (PODC) é cíclico. Eficiência (meios), eficácia (fins) e efetividade (impacto) medem o desempenho. Os níveis institucional, intermediário e operacional distinguem-se por abrangência e prazo das decisões.</p>`],
["9. Mapa mental",`<pre>ORGANIZAÇÃO (sistema aberto)
├─ Natureza: pública | privada com fins lucrativos | sem fins lucrativos | mista (ex.: sociedade de economia mista)
├─ Estrutura
│  ├─ Formal (organograma): hierarquia, unidade de comando, amplitude de controle, centralização
│  ├─ Informal: relações espontâneas
│  └─ Departamentalização: funcional, produto, território, cliente, processo, matricial
├─ Processo administrativo (PODC): Planejar → Organizar → Dirigir → Controlar
├─ Desempenho: Eficiência (fazer certo) | Eficácia (atingir objetivo) | Efetividade (impacto)
└─ Níveis: Institucional/Estratégico | Intermediário/Tático | Operacional</pre>`]],
q:[
["Uma companhia de saneamento reduziu em 15% o custo de manutenção de uma adutora, mantendo a mesma extensão de rede atendida. Esse resultado ilustra, principalmente:",["Eficácia, pois a meta foi cumprida.","Eficiência, pois houve melhor uso dos recursos para o mesmo resultado.","Efetividade, pois houve mudança social duradoura.","Centralização, pois as decisões foram concentradas.","Delegação, pois a autoridade foi transferida."],1,"Menor custo para o mesmo resultado é o critério de eficiência. O enunciado não fala de meta cumprida (eficácia) nem de impacto duradouro (efetividade). Centralização e delegação tratam da distribuição de autoridade."],
["Uma área cumpriu integralmente a meta de atendimentos do mês, mas utilizou 40% mais horas de trabalho que o previsto. Pode-se afirmar que a área foi:",["Eficiente e ineficaz.","Eficaz e pouco eficiente.","Eficaz e eficiente.","Ineficaz e pouco eficiente.","Efetiva e eficiente."],1,"Cumprir a meta é eficácia; gastar mais recursos que o previsto indica baixa eficiência. Efetividade depende do impacto, que o enunciado não informa."],
["A função administrativa que consiste em comparar o desempenho obtido com o padrão esperado e adotar ações corretivas é:",["Planejamento.","Organização.","Direção.","Controle.","Delegação."],3,"Controle: medir, comparar com o padrão e corrigir desvios. Planejamento define objetivos; organização estrutura; direção orienta pessoas; delegação não é função do PODC."],
["Decisões de longo prazo, com visão global da organização e definição de seu rumo, são típicas do nível:",["Operacional.","Tático.","Intermediário.","Institucional (estratégico).","Departamental."],3,"A alta direção atua no nível institucional, também chamado estratégico. Tático e intermediário traduzem a estratégia em planos por área; o operacional cuida de tarefas de curto prazo."],
["A amplitude de controle de um gestor corresponde:",["Ao número de níveis hierárquicos da organização.","Ao número de subordinados que ele supervisiona diretamente.","Ao grau de formalização das regras.","Ao orçamento sob sua responsabilidade.","À distância física entre a sede e as unidades."],1,"Amplitude de controle é o número de subordinados diretos. Não se confunde com o número de níveis, que é a altura da hierarquia."],
["Sobre a estrutura informal de uma organização, é correto afirmar que:",["É a que está representada no organograma.","Surge das relações sociais espontâneas e coexiste com a estrutura formal.","Substitui a hierarquia formal quando esta é eficiente.","É sempre prejudicial e deve ser eliminada.","Só existe em organizações sem fins lucrativos."],1,"A estrutura informal nasce das relações espontâneas, não consta do organograma e convive com a formal; pode ajudar ou atrapalhar, conforme o caso."]]};

L.es2={t:"ES-2 · Planejamento e Gestão Estratégica",cob:"Cobre todos os assuntos do item 2 do Anexo III (Conhecimentos Específicos – Assistente Administrativo).",
sec:[
["1. Explicação completa e didática",`<p><b>Planejamento</b> é o processo de definir aonde a organização quer chegar e como chegar lá: diagnosticar a situação, fixar objetivos, escolher estratégias e alocar recursos. Ele tem três níveis, que acompanham os níveis organizacionais: o <b>estratégico</b> (longo prazo, abrange a organização inteira, é conduzido pela alta direção e trata da relação com o ambiente externo), o <b>tático</b> (médio prazo, abrange cada área e traduz a estratégia em planos específicos, sob responsabilidade das gerências) e o <b>operacional</b> (curto prazo, abrange tarefas e rotinas, com procedimentos, métodos, orçamentos, cronogramas e regulamentos, sob responsabilidade da supervisão).</p>
<p>O planejamento estratégico parte da identidade da organização: <b>missão</b>, <b>visão</b> e <b>valores</b>. A missão é a razão de ser, o que a organização faz, para quem e para quê (propósito do presente). A visão é a imagem do futuro desejado (onde se quer chegar). Os valores são os princípios e crenças que orientam comportamentos e decisões (ética, transparência, respeito, responsabilidade socioambiental etc.).</p>
<p>Daí derivam <b>objetivos</b> e <b>metas</b>. O objetivo é o resultado desejado, em geral qualitativo (“melhorar o atendimento”). A meta o torna mensurável, com valor, prazo e responsável (“reduzir de 10 para 5 dias o prazo médio de resposta até dezembro”). Uma boa meta costuma seguir o critério <b>SMART</b>: específica, mensurável, atingível, relevante e com prazo definido.</p>
<p>Para escolher bem, faz-se a <b>análise dos ambientes interno e externo</b>. No ambiente externo, identificam-se <b>oportunidades</b> (fatores favoráveis fora do controle da organização) e <b>ameaças</b> (fatores desfavoráveis fora do controle). O externo divide-se em macroambiente (fatores políticos, econômicos, sociais, tecnológicos, ecológicos e legais, a análise PESTEL) e ambiente de tarefa ou setorial (clientes, fornecedores, concorrentes, órgãos reguladores). No ambiente interno, identificam-se <b>forças</b> (pontos fortes) e <b>fraquezas</b> (pontos fracos) em recursos, competências, estrutura, cultura e processos. O conjunto forma a <b>matriz SWOT</b> (em português, FOFA ou FFOA).</p>
<p><b>Indicadores de desempenho</b> são medidas, em geral numéricas, que mostram se a organização caminha para a meta. Podem medir eficiência (custo por atendimento), eficácia (percentual da meta cumprida) ou efetividade (impacto gerado), e também insumos, processos, produtos e resultados. Um bom indicador é claro, mensurável, comparável no tempo, obtido com custo razoável e útil para decidir.</p>
<p>O <b>acompanhamento e controle</b> comparam o realizado com o planejado e acionam correções. O controle pode ser <b>preventivo</b> (antes da execução), <b>concomitante</b> (durante) ou <b>posterior/corretivo</b> (depois). Seus resultados alimentam o ciclo seguinte de planejamento (PDCA: planejar, executar, verificar, agir).</p>`],
["2. Conceitos fundamentais",`<ul><li><b>Planejamento estratégico:</b> longo prazo, organização toda, alta direção. <b>Tático:</b> médio prazo, por área. <b>Operacional:</b> curto prazo, tarefas e rotinas.</li><li><b>Missão:</b> razão de ser (presente). <b>Visão:</b> futuro desejado. <b>Valores:</b> princípios de conduta.</li><li><b>Objetivo:</b> o que se quer (qualitativo). <b>Meta:</b> quanto e até quando (quantitativa, com prazo).</li><li><b>SWOT:</b> forças e fraquezas (internas); oportunidades e ameaças (externas).</li><li><b>PESTEL:</b> político, econômico, social, tecnológico, ecológico, legal.</li><li><b>Indicador:</b> medida que permite acompanhar um resultado.</li><li><b>Controle:</b> comparar, avaliar e corrigir; pode ser preventivo, concomitante ou posterior.</li></ul>`],
["3. Exemplos práticos",`<ol><li><b>Missão, visão e valores (exemplo fictício).</b> Missão: “Prover água e esgotamento sanitário com qualidade à população”. Visão: “Ser referência regional em qualidade e sustentabilidade nos serviços”. Valores: ética, transparência, respeito ao meio ambiente.</li><li><b>Do objetivo ao indicador (números ilustrativos).</b> Objetivo: ampliar o atendimento com esgotamento sanitário. Meta: elevar de 40% para 50% o percentual de domicílios atendidos até dezembro de 2028. Indicador: percentual de domicílios com acesso à rede. Acompanhamento: relatório trimestral. Se houver atraso, ação corretiva (revisar prazos, recursos ou prioridades).</li><li><b>SWOT (exemplo fictício).</b> Força: equipe técnica experiente. Fraqueza: sistemas de informação desatualizados. Oportunidade: nova legislação que amplia as possibilidades de atuação do setor. Ameaça: eventos climáticos extremos que afetam a operação.</li></ol>`],
["4. Aplicações no ambiente administrativo",`<ul><li>Organizar dados em planilhas e relatórios que alimentam os indicadores e o acompanhamento das metas.</li><li>Controlar prazos e cronogramas (nível operacional do planejamento) e sinalizar desvios com antecedência.</li><li>Conhecer a missão, a visão e os valores da empresa (veja a área de Códigos e Políticas) para agir de acordo com eles no atendimento e na redação de documentos.</li><li>Fornecer subsídios a relatórios, como prevê o Anexo II para o cargo.</li></ul>`],
["5. Quadros comparativos",`<div class="tbl"><table><tr><th>Planejamento</th><th>Prazo</th><th>Abrangência</th><th>Responsáveis</th><th>Conteúdo típico</th></tr><tr><td>Estratégico</td><td>Longo</td><td>Organização inteira</td><td>Alta direção</td><td>Missão, visão, objetivos estratégicos</td></tr><tr><td>Tático</td><td>Médio</td><td>Cada área</td><td>Gerências</td><td>Planos por departamento</td></tr><tr><td>Operacional</td><td>Curto</td><td>Tarefas e rotinas</td><td>Supervisão e equipes</td><td>Procedimentos, cronogramas, orçamentos</td></tr></table></div>
<div class="tbl"><table><tr><th>SWOT</th><th>Favorável</th><th>Desfavorável</th></tr><tr><td><b>Ambiente interno</b></td><td>Forças</td><td>Fraquezas</td></tr><tr><td><b>Ambiente externo</b></td><td>Oportunidades</td><td>Ameaças</td></tr></table></div>
<div class="tbl"><table><tr><th>Missão</th><th>Visão</th><th>Valores</th></tr><tr><td>Razão de ser, presente</td><td>Futuro desejado</td><td>Princípios de conduta</td></tr></table></div>`],
["6. Pontos importantes para memorizar",`<ul><li>Forças e fraquezas são <b>internas</b>; oportunidades e ameaças são <b>externas</b> (não controladas).</li><li>Missão = presente; visão = futuro; valores = conduta.</li><li>Meta = objetivo + valor + prazo.</li><li>Estratégico = longo prazo/alta direção; tático = áreas; operacional = rotinas.</li><li>Controle: preventivo (antes), concomitante (durante), posterior (depois).</li></ul>`],
["7. Pegadinhas comuns em provas de múltipla escolha",`<p class="mu">Armadilhas frequentes neste tipo de prova, elaboradas por mim para treino. Não são levantamento estatístico da AOCP.</p><ul><li>Classificar fatos internos como oportunidades ou ameaças (e vice-versa). Se a organização controla o fator, é interno.</li><li>Chamar de “meta” um enunciado sem valor nem prazo, ou de “objetivo” algo numérico com data.</li><li>Trocar missão por visão: a visão sempre olha para o futuro.</li><li>Atribuir o planejamento estratégico à supervisão operacional.</li><li>Dizer que o controle só existe depois da execução.</li></ul>`],
["8. Resumo da matéria",`<p>O planejamento se desdobra em estratégico, tático e operacional. A identidade da organização é dada por missão, visão e valores. Objetivos são traduzidos em metas mensuráveis e acompanhados por indicadores. A análise SWOT cruza ambiente interno (forças e fraquezas) e externo (oportunidades e ameaças). O controle compara o realizado com o planejado e corrige desvios, fechando o ciclo PDCA.</p>`],
["9. Mapa mental",`<pre>PLANEJAMENTO E GESTÃO ESTRATÉGICA
├─ Níveis: Estratégico (longo) | Tático (médio) | Operacional (curto)
├─ Identidade: Missão (presente) | Visão (futuro) | Valores (conduta)
├─ Objetivos (qualitativos) → Metas (valor + prazo, SMART)
├─ Ambientes
│  ├─ Interno: Forças | Fraquezas
│  └─ Externo: Oportunidades | Ameaças (PESTEL, ambiente de tarefa)
├─ Indicadores: eficiência | eficácia | efetividade
└─ Acompanhamento e controle: preventivo | concomitante | posterior → PDCA</pre>`]],
q:[
["Na análise SWOT, a escassez de pessoal qualificado em um setor da própria organização é classificada como:",["Força.","Oportunidade.","Fraqueza.","Ameaça.","Meta."],2,"É um fator interno desfavorável: fraqueza. Ameaças e oportunidades são externas."],
["Uma mudança na legislação que amplia as possibilidades de atuação de empresas do setor é, para a organização, um(a):",["Força.","Fraqueza.","Ameaça.","Oportunidade.","Missão."],3,"É um fator externo favorável: oportunidade."],
["O enunciado “Ser reconhecida como referência regional em qualidade no atendimento” é um exemplo típico de:",["Missão.","Visão.","Valor.","Meta.","Indicador."],1,"Descreve um futuro desejado: visão. A missão trata da razão de ser; valores tratam de princípios; metas trazem valores e prazos."],
["Qual dos enunciados a seguir é uma meta?",["Melhorar o atendimento ao público.","Ser a melhor empresa do setor.","Reduzir de 10 para 5 dias o prazo médio de resposta às solicitações até dezembro.","Valorizar as pessoas.","Atuar com ética."],2,"Meta é mensurável e tem prazo. Os demais são objetivos amplos, visão ou valores."],
["O planejamento que traduz as decisões estratégicas em planos para cada área, com horizonte de médio prazo, é o:",["Estratégico.","Tático.","Operacional.","Contingencial.","Institucional."],1,"Tático: por área e de médio prazo. O estratégico cobre toda a organização e o operacional trata de tarefas e rotinas."],
["O controle exercido durante a execução das atividades, permitindo correção imediata, é denominado:",["Preventivo.","Concomitante.","Posterior.","Estratégico.","Orçamentário."],1,"Controle concomitante: durante a execução. Preventivo ocorre antes; posterior, depois."]]};

L.es3={t:"ES-3 · Gestão de Processos, Qualidade e Inovação",cob:"Cobre todos os assuntos do item 3 do Anexo III (Conhecimentos Específicos – Assistente Administrativo).",
sec:[
["1. Explicação completa e didática",`<p><b>Processo</b> é um conjunto de atividades inter-relacionadas que transforma entradas (insumos) em saídas (produtos ou serviços) que agregam valor ao cliente. Elementos: fornecedor, entrada, atividades, saída, cliente, responsável (dono do processo), recursos e indicadores. Os processos podem ser <b>finalísticos</b> (ligados à atividade-fim: no saneamento, captação, tratamento e distribuição), de <b>suporte</b> (compras, RH, TI) e <b>gerenciais</b> (planejamento e controle). A <b>gestão por processos</b> enxerga a organização de forma horizontal, atravessando os departamentos, com foco no cliente e no resultado, e substitui a visão em “silos” funcionais pela responsabilidade de ponta a ponta de um dono do processo.</p>
<p>A <b>gestão pela qualidade</b> evoluiu da simples inspeção para o controle da qualidade, a garantia da qualidade e a gestão da qualidade total (TQM), que envolve todos na busca da satisfação do cliente. Qualidade, nessa visão, é atender às necessidades do cliente (adequação ao uso). Autores clássicos: <b>Deming</b> (difundiu o ciclo PDCA, criado por Shewhart), <b>Juran</b> (adequação ao uso; trilogia: planejamento, controle e melhoria da qualidade), <b>Crosby</b> (zero defeitos; fazer certo da primeira vez), <b>Ishikawa</b> (diagrama de causa e efeito e círculos de controle da qualidade) e <b>Feigenbaum</b> (controle da qualidade total). Ferramentas usuais: folha de verificação, histograma, <b>diagrama de Pareto</b> (poucas causas respondem por grande parte dos problemas), diagrama de causa e efeito (espinha de peixe), diagrama de dispersão, fluxograma e gráfico de controle. Também são comuns o <b>5W2H</b> (what, why, where, when, who, how, how much: plano de ação) e o <b>5S</b> (utilização, organização, limpeza, saúde/padronização e disciplina), aplicável à organização do ambiente de trabalho.</p>
<p><b>Mudança e inovação.</b> A mudança organizacional pode ser planejada ou emergente e encontra <b>resistência</b> (medo, insegurança, hábito, interesses ameaçados). Reduz-se a resistência com comunicação clara, participação, treinamento e apoio da liderança. No modelo de Lewin, a mudança tem três fases: <b>descongelamento</b>, <b>mudança</b> e <b>recongelamento</b>. <b>Inovação</b> é a introdução de algo novo ou significativamente melhorado (produto, processo, marketing ou organização) que gera valor; difere de <b>invenção</b> (ideia ou criação que pode nunca ser implementada). Pode ser <b>incremental</b> (melhorias graduais) ou <b>radical/disruptiva</b> (ruptura).</p>
<p><b>Mapeamento, análise e melhoria de processos.</b> Mapear é representar o processo, geralmente em dois momentos: <b>como é</b> (AS-IS) e <b>como deve ser</b> (TO-BE). Técnicas: <b>fluxograma</b> (símbolos como terminador, atividade, decisão em losango, documento e conector), <b>SIPOC</b> (fornecedores, entradas, processo, saídas e clientes) e <b>BPMN</b> (notação padronizada com eventos, atividades, <i>gateways</i> de decisão e raias). Na análise, procuram-se gargalos, retrabalho, redundâncias, esperas e atividades que não agregam valor. Na melhoria, eliminam-se, simplificam-se, combinam-se, automatizam-se ou redistribuem-se atividades; depois, implanta-se e monitora-se o resultado.</p>
<p><b>Padronização.</b> Padronizar é registrar a melhor forma conhecida de executar uma atividade, por meio de <b>POP</b> (procedimento operacional padrão), instruções de trabalho, manuais e normas. Reduz variações e erros, facilita o treinamento, garante rastreabilidade e serve de base para a melhoria. Enquanto o PDCA busca <b>melhorar</b>, o SDCA (padronizar, executar, verificar, agir) busca <b>manter</b> o padrão.</p>
<p><b>Melhoria contínua.</b> É a busca permanente e gradual de aperfeiçoamento. O <b>Kaizen</b> (do japonês, “mudar para melhor”) envolve todos, com pequenas melhorias constantes. O <b>PDCA</b> organiza o ciclo: planejar (identificar o problema, analisar causas e definir o plano), executar, verificar (comparar resultados com o planejado) e agir (padronizar o que deu certo ou corrigir o que falhou). O <b>benchmarking</b> compara práticas com as das melhores organizações.</p>`],
["2. Conceitos fundamentais",`<ul><li><b>Processo:</b> atividades inter-relacionadas que transformam entradas em saídas com valor ao cliente.</li><li><b>Gestão por processos:</b> visão transversal, foco no cliente, dono do processo.</li><li><b>Qualidade:</b> atendimento às necessidades do cliente; TQM envolve toda a organização.</li><li><b>PDCA:</b> planejar, executar, verificar, agir. <b>SDCA:</b> padronizar e manter.</li><li><b>Ferramentas:</b> Pareto, Ishikawa, histograma, folha de verificação, dispersão, fluxograma, gráfico de controle, 5W2H, 5S.</li><li><b>Mudança:</b> descongelar, mudar, recongelar; resistência exige comunicação e participação.</li><li><b>Inovação:</b> novidade implementada que gera valor; incremental ou radical.</li><li><b>Mapeamento:</b> AS-IS e TO-BE; fluxograma, SIPOC, BPMN.</li><li><b>POP:</b> procedimento operacional padrão. <b>Kaizen:</b> melhoria contínua. <b>Benchmarking:</b> comparação com as melhores práticas.</li></ul>`],
["3. Exemplos práticos",`<ol><li><b>Mapeamento (ilustrativo).</b> O processo “atender solicitação de segunda via de documento” passa por recepção, registro, análise, emissão e entrega. No AS-IS, o pedido espera dois dias em cada aprovação. No TO-BE, eliminam-se aprovações desnecessárias e define-se prazo único, reduzindo o tempo total.</li><li><b>Pareto.</b> Das reclamações do mês, 80% se concentram em três tipos. A equipe prioriza esses três primeiros, para obter maior efeito com menor esforço.</li><li><b>PDCA.</b> Planejar: reduzir erros de digitação em relatórios. Executar: usar lista de conferência no setor-piloto. Verificar: comparar os erros antes e depois. Agir: adotar a lista em todos os setores e registrá-la no POP.</li><li><b>5S.</b> Descartar o que não se usa no arquivo, ordenar pastas por assunto, limpar o ambiente, padronizar etiquetas e manter a disciplina.</li></ol>`],
["4. Aplicações no ambiente administrativo",`<ul><li>Descrever e seguir POPs de protocolo, expedição e arquivamento.</li><li>Usar fluxogramas simples para entender e explicar o caminho de documentos.</li><li>Propor melhorias na rotina: eliminar retrabalho, padronizar modelos, usar listas de verificação.</li><li>Colaborar com mudanças de sistema ou procedimento, esclarecendo dúvidas e reduzindo resistências na equipe.</li></ul>`],
["5. Quadros comparativos",`<div class="tbl"><table><tr><th></th><th>Invenção</th><th>Inovação</th></tr><tr><td>Natureza</td><td>Ideia ou criação nova</td><td>Novidade implementada</td></tr><tr><td>Valor</td><td>Pode não gerar valor</td><td>Gera valor (econômico ou social)</td></tr></table></div>
<div class="tbl"><table><tr><th>Ferramenta</th><th>Para que serve</th></tr><tr><td>Diagrama de Pareto</td><td>Priorizar as poucas causas mais relevantes</td></tr><tr><td>Diagrama de Ishikawa</td><td>Organizar as causas de um problema (espinha de peixe)</td></tr><tr><td>Fluxograma</td><td>Representar a sequência do processo</td></tr><tr><td>5W2H</td><td>Plano de ação (o que, por que, onde, quando, quem, como, quanto)</td></tr><tr><td>5S</td><td>Organização e disciplina do ambiente de trabalho</td></tr><tr><td>PDCA</td><td>Melhoria contínua em ciclo</td></tr></table></div>
<div class="tbl"><table><tr><th>PDCA</th><th>SDCA</th></tr><tr><td>Melhorar processos</td><td>Manter o padrão</td></tr></table></div>`],
["6. Pontos importantes para memorizar",`<ul><li>Gestão por processos: visão <b>horizontal</b>, foco no cliente.</li><li>PDCA: Planejar, Executar (Do), Verificar (Check), Agir (Act).</li><li>Fluxograma: <b>losango = decisão</b>.</li><li>Pareto: poucas causas, grande parte dos efeitos.</li><li>Lewin: descongelar, mudar, recongelar.</li><li>Inovação exige implementação e valor; invenção, não.</li><li>5W2H: o quê, por quê, onde, quando, quem, como, quanto custa.</li></ul>`],
["7. Pegadinhas comuns em provas de múltipla escolha",`<p class="mu">Armadilhas frequentes neste tipo de prova, elaboradas por mim para treino. Não são levantamento estatístico da AOCP.</p><ul><li>Confundir <b>invenção</b> com <b>inovação</b>.</li><li>Trocar a etapa “Check” (verificar) por “Control” ou por “Act”.</li><li>Atribuir ao fluxograma símbolos errados (decisão não é retângulo).</li><li>Achar que gestão por processos elimina a estrutura funcional por completo: ela a complementa com visão transversal.</li><li>Dizer que a padronização engessa e impede a melhoria: ela é a base para melhorar.</li><li>Dizer que a resistência à mudança é sempre irracional: ela tem causas que podem ser tratadas.</li></ul>`],
["8. Resumo da matéria",`<p>Processos transformam entradas em saídas de valor e são geridos de forma transversal. A qualidade busca atender o cliente, com ferramentas como Pareto, Ishikawa, 5W2H e 5S. A mudança exige lidar com resistências (Lewin), e a inovação é novidade implementada que gera valor. O mapeamento (AS-IS e TO-BE) permite analisar e melhorar processos; os POPs padronizam; o PDCA e o Kaizen sustentam a melhoria contínua.</p>`],
["9. Mapa mental",`<pre>PROCESSOS, QUALIDADE E INOVAÇÃO
├─ Gestão por processos: entrada → atividades → saída → cliente (dono do processo)
├─ Qualidade: inspeção → controle → garantia → TQM
│  ├─ Autores: Deming, Juran, Crosby, Ishikawa, Feigenbaum
│  └─ Ferramentas: Pareto, Ishikawa, histograma, fluxograma, 5W2H, 5S
├─ Mudança (Lewin): descongelar → mudar → recongelar | resistência
├─ Inovação: incremental | radical (≠ invenção)
├─ Mapeamento: AS-IS → TO-BE | fluxograma, SIPOC, BPMN
├─ Padronização: POP, manuais (SDCA)
└─ Melhoria contínua: PDCA, Kaizen, benchmarking</pre>`]],
q:[
["Na etapa “C” (Check) do ciclo PDCA, a organização:",["Define os objetivos e o plano de ação.","Executa o plano em escala total.","Verifica os resultados, comparando-os com o que foi planejado.","Padroniza as ações bem-sucedidas.","Demite os responsáveis pelas falhas."],2,"Check é verificar e comparar resultados com o planejado. A padronização ocorre na etapa Act."],
["No fluxograma, o losango representa, usualmente:",["Início ou fim do processo.","Uma atividade.","Uma decisão.","Um documento.","Um conector."],2,"O losango indica ponto de decisão, com saídas como “sim” e “não”."],
["A principal característica da gestão por processos é:",["Foco exclusivo nas hierarquias departamentais.","Visão transversal, que atravessa os departamentos, voltada ao cliente e ao resultado.","Eliminação de padrões e procedimentos.","Centralização absoluta das decisões.","Ênfase apenas na inspeção final dos produtos."],1,"A gestão por processos tem visão horizontal, de ponta a ponta, com foco no cliente e no resultado, indo além da lógica de departamentos isolados."],
["Diferencia-se invenção de inovação porque:",["A invenção sempre gera lucro.","A inovação exige implementação e geração de valor, enquanto a invenção pode ficar apenas na ideia.","A inovação nunca envolve processos.","A invenção é sempre radical.","Inovação e invenção são sinônimos."],1,"Inovação é novidade implementada que gera valor; invenção pode nunca chegar ao mercado ou à prática."],
["O Diagrama de Pareto é utilizado para:",["Representar graficamente o fluxo de um processo.","Priorizar as causas ou problemas que respondem pela maior parte dos efeitos.","Planejar a distribuição de tarefas no tempo.","Medir a satisfação do cliente.","Organizar o espaço físico de trabalho."],1,"O Pareto ordena as causas por frequência ou impacto, mostrando as poucas mais relevantes."],
["Um Procedimento Operacional Padrão (POP) tem como finalidade:",["Substituir a hierarquia da organização.","Descrever de forma uniforme como executar determinada atividade, reduzindo variações e erros.","Definir a visão de longo prazo da empresa.","Registrar a ata das reuniões.","Medir o desempenho individual de cada empregado."],1,"O POP registra o jeito padrão de executar uma atividade, para reduzir variações, facilitar treinamento e servir de base para melhorias."]]};
function mk(t,cob,a){return {t:t,cob:cob,sec:[["1. Explicação completa e didática",a[0]],["2. Conceitos fundamentais",a[1]],["3. Exemplos práticos",a[2]],["4. Aplicações no ambiente administrativo",a[3]],["5. Quadros comparativos",a[4]],["6. Pontos importantes para memorizar",a[5]],["7. Pegadinhas comuns em provas de múltipla escolha",'<p class="mu">Armadilhas frequentes neste tipo de prova, elaboradas por mim para treino. Não são levantamento estatístico da AOCP.</p>'+a[6]],["8. Resumo da matéria",a[7]],["9. Mapa mental","<pre>"+a[8]+"</pre>"]],q:a[9]}}
L.es4=mk("ES-4 · Gestão de Pessoas","Cobre todos os assuntos do item 4 do Anexo III: sistemas de informação de RH, organização e controle de dados pessoais, desenvolvimento de RH, educação corporativa, trabalho em equipe, relações humanas, administração de conflitos, recrutamento e seleção, treinamento e desenvolvimento, avaliação de desempenho, motivação, liderança, cultura e clima organizacional.",[
`<p><b>Gestão de pessoas</b> é o conjunto de políticas e práticas que orienta o comportamento humano nas organizações. Seus processos costumam ser agrupados em: <b>agregar</b> (recrutamento e seleção), <b>aplicar</b> (desenho de cargos, avaliação de desempenho), <b>recompensar</b> (remuneração, benefícios), <b>desenvolver</b> (treinamento e desenvolvimento), <b>manter</b> (saúde, segurança, relações com os empregados) e <b>monitorar</b> (sistemas de informação e auditoria).</p>
<p>O <b>Sistema de Informação de Recursos Humanos (SIRH)</b> reúne em banco de dados integrado as informações de pessoal (cadastro, frequência, folha, benefícios, treinamentos, avaliações) para apoiar decisões e rotinas. A <b>organização e o controle de dados pessoais</b> exigem sigilo, acesso restrito, atualização e segurança. Na Lei Geral de Proteção de Dados (Lei 13.709/2018), o tratamento de dados deve observar princípios como <b>finalidade</b> (propósito legítimo e informado), <b>adequação</b>, <b>necessidade</b> (mínimo necessário), <b>livre acesso</b>, <b>qualidade dos dados</b>, <b>transparência</b>, <b>segurança</b>, <b>prevenção</b>, <b>não discriminação</b> e <b>responsabilização e prestação de contas</b>.</p>
<p><b>Recrutamento</b> é o processo de atrair candidatos qualificados; <b>seleção</b> é a escolha, entre eles, dos mais adequados ao cargo. O recrutamento pode ser <b>interno</b> (promoção, transferência: mais rápido, barato e motivador, mas limita a renovação de ideias), <b>externo</b> (traz novas ideias e competências, mas custa mais e demora) ou <b>misto</b>. Na seleção usam-se entrevistas, testes de conhecimento e psicológicos, dinâmicas de grupo e simulações. Na CASAN, a seleção para o cargo ocorre por concurso público (provas objetivas), com contratação pela CLT.</p>
<p><b>Treinamento</b> prepara a pessoa para as exigências do cargo atual, em geral no curto prazo, trabalhando conhecimentos, habilidades e atitudes (CHA). <b>Desenvolvimento</b> tem foco mais amplo e de longo prazo, no crescimento e na carreira. O ciclo do treinamento compreende levantamento de necessidades, programação, execução e avaliação (os quatro níveis de Kirkpatrick: reação, aprendizagem, comportamento e resultados). A <b>educação corporativa</b> é um sistema de aprendizagem contínua alinhado à estratégia da organização, como as universidades corporativas.</p>
<p>A <b>avaliação de desempenho</b> mede de forma sistemática o desempenho individual e o potencial, para feedback, desenvolvimento, promoções e remuneração. Métodos: escalas gráficas, avaliação 360 graus (autoavaliação, chefia, pares, subordinados e clientes), avaliação por objetivos, incidentes críticos e escolha forçada. Erros comuns do avaliador: <b>efeito halo</b> (uma característica contamina todo o julgamento), <b>tendência central</b>, <b>leniência</b> ou <b>rigor excessivo</b>, e <b>efeito de recência</b> (só se considera o período mais recente).</p>
<p><b>Motivação</b>: Maslow (hierarquia: fisiológicas, segurança, sociais, estima, autorrealização); Herzberg (dois fatores: os <b>higiênicos</b>, como salário, condições de trabalho e supervisão, evitam a insatisfação, e os <b>motivacionais</b>, como reconhecimento, realização, responsabilidade e crescimento, geram satisfação); McClelland (necessidades de realização, afiliação e poder); Vroom (expectativa) e Adams (equidade). <b>Liderança</b> é a capacidade de influenciar pessoas para objetivos comuns. Estilos de Lewin: <b>autocrático</b> (decisões centralizadas no líder), <b>democrático</b> (participativo) e <b>liberal</b> (<i>laissez-faire</i>, pouca interferência). Na teoria situacional (Hersey e Blanchard), o estilo se adapta à maturidade do liderado: determinar, persuadir, compartilhar e delegar.</p>
<p><b>Trabalho em equipe</b>: equipe é mais que um grupo, pois tem objetivo comum, papéis complementares e <b>sinergia</b>. Fases de Tuckman: formação, tormenta, normatização e desempenho. A <b>Escola de Relações Humanas</b> (Elton Mayo, experiência de Hawthorne) mostrou a importância do grupo, da comunicação e da organização informal. <b>Conflitos</b> podem ser funcionais ou disfuncionais, de tarefa, de relacionamento ou de processo. Estilos de lidar com eles (Thomas-Kilmann): competição, colaboração, compromisso, evitação e acomodação; técnicas: negociação e mediação. <b>Cultura organizacional</b> é o conjunto de valores, crenças e pressupostos compartilhados (Schein: artefatos, valores expostos e pressupostos básicos), estável e profunda; <b>clima organizacional</b> é a percepção dos empregados sobre o ambiente de trabalho em dado momento, mais variável, e é medido por pesquisa de clima.</p>`,
`<ul><li><b>Recrutamento interno x externo; seleção.</b></li><li><b>Treinamento</b> (cargo atual, curto prazo) x <b>desenvolvimento</b> (carreira, longo prazo); educação corporativa.</li><li><b>SIRH</b> e proteção de dados pessoais (LGPD).</li><li><b>Avaliação de desempenho:</b> 360 graus; erros de avaliação (halo, tendência central, recência).</li><li><b>Motivação:</b> Maslow, Herzberg, McClelland, Vroom, Adams.</li><li><b>Liderança:</b> autocrática, democrática, liberal; situacional.</li><li><b>Equipe</b> (sinergia) x grupo; fases de Tuckman.</li><li><b>Conflito:</b> estilos de Thomas-Kilmann; negociação e mediação.</li><li><b>Cultura</b> (estável) x <b>clima</b> (percepção atual).</li></ul>`,
`<ol><li><b>Recrutamento.</b> Uma vaga de nível superior ao do cargo operacional é aberta primeiro internamente: um assistente com bom desempenho é promovido (ganho de motivação e conhecimento da empresa), mas surge nova vaga no cargo de origem.</li><li><b>Avaliação.</b> Uma chefia dá nota máxima a todos por simpatia (leniência) ou deixa de lembrar do semestre inteiro e avalia só o último mês (recência). A avaliação 360 graus reduz esses vieses ao ouvir várias fontes.</li><li><b>Conflito.</b> Dois colegas discordam sobre a divisão de tarefas. A chefia promove uma conversa para chegar a um acordo que atenda a ambos (colaboração) e registra o combinado.</li></ol>`,
`<ul><li>Manter cadastros de pessoal atualizados e protegidos, acessando apenas o necessário (LGPD).</li><li>Apoiar processos de seleção, treinamento e avaliação com organização de documentos, listas de presença, certificados e relatórios.</li><li>Contribuir para um bom clima: comunicação respeitosa, cooperação e cuidado com conflitos.</li><li>Dar e receber feedback com objetividade.</li></ul>`,
`<div class="tbl"><table><tr><th></th><th>Treinamento</th><th>Desenvolvimento</th></tr><tr><td>Foco</td><td>Cargo atual</td><td>Carreira e crescimento</td></tr><tr><td>Prazo</td><td>Curto</td><td>Longo</td></tr></table></div><div class="tbl"><table><tr><th></th><th>Cultura</th><th>Clima</th></tr><tr><td>Natureza</td><td>Valores e pressupostos compartilhados</td><td>Percepção do ambiente</td></tr><tr><td>Estabilidade</td><td>Estável, profunda</td><td>Mais variável</td></tr></table></div><div class="tbl"><table><tr><th>Herzberg</th><th>Exemplos</th><th>Efeito</th></tr><tr><td>Higiênicos</td><td>Salário, condições, supervisão, políticas</td><td>Evitam insatisfação</td></tr><tr><td>Motivacionais</td><td>Reconhecimento, realização, responsabilidade</td><td>Geram satisfação</td></tr></table></div><div class="tbl"><table><tr><th>Estilo</th><th>Característica</th></tr><tr><td>Autocrático</td><td>Líder centraliza as decisões</td></tr><tr><td>Democrático</td><td>Decisões com participação do grupo</td></tr><tr><td>Liberal</td><td>Liderados decidem; pouca interferência</td></tr></table></div>`,
`<ul><li>Herzberg: higiênicos <b>evitam insatisfação</b>; motivacionais <b>geram satisfação</b>.</li><li>Maslow: fisiológicas → segurança → sociais → estima → autorrealização.</li><li>Tuckman: formação, tormenta, normatização, desempenho.</li><li>Halo = uma característica contamina o todo. Recência = só o fim do período pesa.</li><li>Clima = percepção do momento; cultura = valores profundos.</li></ul>`,
`<ul><li>Inverter higiênicos e motivacionais.</li><li>Confundir treinamento com desenvolvimento.</li><li>Dizer que cultura e clima são sinônimos.</li><li>Achar que recrutamento interno é sempre melhor (limita a renovação).</li><li>Tratar grupo e equipe como a mesma coisa (equipe tem sinergia e objetivo comum).</li><li>Confundir mediação (terceiro neutro auxilia) com arbitragem (terceiro decide).</li></ul>`,
`<p>Gestão de pessoas envolve agregar, aplicar, recompensar, desenvolver, manter e monitorar. O SIRH exige cuidado com dados pessoais (LGPD). Recrutamento atrai, seleção escolhe. Treinamento e desenvolvimento diferem em foco e prazo. A avaliação de desempenho tem métodos e vieses conhecidos. Motivação e liderança têm teorias clássicas. Equipes passam por fases, conflitos exigem gestão, e clima é distinto de cultura.</p>`,
`GESTÃO DE PESSOAS
├─ Processos: agregar | aplicar | recompensar | desenvolver | manter | monitorar
├─ SIRH e dados pessoais (LGPD: finalidade, necessidade, segurança...)
├─ Recrutamento (interno | externo | misto) → Seleção
├─ Treinamento (curto prazo) | Desenvolvimento (carreira) | Educação corporativa
├─ Avaliação de desempenho: 360° | vieses (halo, recência, tendência central)
├─ Motivação: Maslow | Herzberg | McClelland | Vroom | Adams
├─ Liderança: autocrática | democrática | liberal | situacional
├─ Equipe (Tuckman) | Relações humanas (Mayo)
├─ Conflitos: competição | colaboração | compromisso | evitação | acomodação
└─ Cultura (estável) x Clima (percepção atual)`,
[["Segundo a teoria dos dois fatores de Herzberg, os fatores higiênicos (como salário e condições de trabalho):",["Geram, por si sós, alta motivação duradoura.","Evitam a insatisfação, mas não geram, sozinhos, satisfação.","São idênticos aos fatores motivacionais.","Dizem respeito apenas à autorrealização.","Não têm influência sobre o ambiente de trabalho."],1,"Fatores higiênicos evitam insatisfação; reconhecimento, responsabilidade e crescimento (motivacionais) geram satisfação."],
["Uma vantagem do recrutamento interno é:",["Trazer sempre ideias totalmente novas à organização.","Aumentar a motivação dos empregados e reduzir tempo e custo do processo.","Eliminar a necessidade de seleção.","Evitar conflitos entre colegas.","Dispensar a análise do perfil do cargo."],1,"O recrutamento interno motiva, é mais rápido e barato, mas limita a renovação de ideias. A seleção continua necessária."],
["Em uma avaliação de desempenho, quando uma característica positiva do avaliado influencia o julgamento de todos os demais aspectos, ocorre o:",["Efeito de recência.","Efeito halo.","Tendência central.","Rigor excessivo.","Efeito de contraste."],1,"Efeito halo é a contaminação do julgamento global por uma característica marcante. Recência é o peso excessivo do período mais recente."],
["O estilo de liderança em que o líder centraliza as decisões e impõe as ordens é o:",["Democrático.","Liberal.","Autocrático.","Situacional.","Transformacional."],2,"Na classificação de Lewin, o autocrático centraliza decisões; o democrático as divide com o grupo; o liberal dá ampla liberdade."],
["A percepção que os empregados têm do ambiente de trabalho em determinado momento, medida por pesquisa, é o:",["Clima organizacional.","Pressuposto básico.","Organograma.","Desenho de cargos.","Benchmarking."],0,"Clima é a percepção atual do ambiente, mais variável. Cultura é o conjunto mais estável de valores e pressupostos."],
["Ao tratar dados pessoais de empregados em um sistema de RH, o princípio da necessidade (LGPD) significa:",["Coletar todos os dados possíveis, pensando em usos futuros.","Limitar o tratamento ao mínimo necessário para a finalidade pretendida.","Compartilhar os dados livremente entre áreas.","Manter os dados indefinidamente.","Dispensar a segurança das informações."],1,"Necessidade é a limitação do tratamento ao mínimo necessário para as finalidades, com dados pertinentes, proporcionais e não excessivos."]]]);
L.es5=mk("ES-5 · Comunicação Organizacional e Atendimento","Cobre todos os assuntos do item 5 do Anexo III: elementos da comunicação, comunicação corporativa, comunicação no ambiente de trabalho, qualidade no atendimento, postura profissional e relações interpessoais.",[
`<p><b>Comunicação</b> é o processo de transmitir e compreender informações. Seus elementos básicos são: <b>emissor</b> (quem envia), <b>receptor</b> (quem recebe), <b>mensagem</b> (conteúdo), <b>canal</b> (meio: e-mail, voz, ofício), <b>código</b> (conjunto de signos comum aos dois, como o idioma), <b>contexto</b> ou referente (a situação a que a mensagem se refere) e <b>feedback</b> (retorno que confirma a compreensão). O <b>ruído</b> é qualquer interferência que prejudica a comunicação. As <b>barreiras</b> podem ser físicas (barulho), semânticas (palavras ambíguas, jargão), psicológicas (preconceito, estresse), pessoais e organizacionais (excesso de níveis hierárquicos).</p>
<p>A <b>comunicação corporativa</b> (ou organizacional) integra todas as formas pelas quais a organização se comunica com seus públicos. Quanto ao público: <b>interna</b> (empregados) e <b>externa</b> (clientes, fornecedores, imprensa, sociedade). Quanto à formalidade: <b>formal</b> (canais oficiais: ofícios, comunicados, intranet, atas) e <b>informal</b> (conversas, boatos, redes pessoais). Quanto à direção: <b>descendente</b> (da chefia para a base), <b>ascendente</b> (da base para a chefia), <b>horizontal</b> ou lateral (entre áreas do mesmo nível) e <b>diagonal</b> (entre níveis e áreas diferentes). O <b>boato</b> prospera quando falta informação oficial.</p>
<p>No <b>ambiente de trabalho</b>, comunicar bem é ser claro, objetivo, cortês e preciso. Pratica-se a <b>escuta ativa</b> (atenção plena, sem interromper, confirmando o entendimento), a <b>assertividade</b> (expressar posição com respeito, sem passividade nem agressividade) e o <b>feedback</b> construtivo. No e-mail corporativo, usam-se assunto claro, linguagem formal, objetividade, revisão antes de enviar e cuidado com destinatários (CC e CCO). Reuniões pedem pauta, horário, registro (ata) e encaminhamentos.</p>
<p>A <b>qualidade no atendimento</b> parte da ideia de que o cliente (externo ou interno) avalia o serviço comparando o que <b>esperava</b> com o que <b>percebeu</b>. Atributos de um bom atendimento: cortesia, presteza, agilidade, empatia, clareza, confiabilidade e resolutividade. O contato direto com o cliente é um “momento da verdade”, quando a imagem da organização é formada. No atendimento presencial, telefônico ou eletrônico: cumprimentar, identificar-se, ouvir, esclarecer, resolver ou encaminhar corretamente e registrar. Em reclamações: ouvir sem interromper, demonstrar empatia, não discutir, buscar solução e dar retorno. O atendimento prioritário previsto em lei (como a idosos, gestantes e pessoas com deficiência) deve ser respeitado.</p>
<p><b>Postura profissional</b> envolve pontualidade, apresentação adequada, cordialidade, responsabilidade, discrição e sigilo das informações, proatividade, ética e uso adequado de redes sociais e dispositivos. As <b>relações interpessoais</b> baseiam-se em respeito, empatia, cooperação e <b>inteligência emocional</b> (Goleman: autoconsciência, autorregulação, motivação, empatia e habilidades sociais), inclusive no convívio com a diversidade.</p>`,
`<ul><li><b>Elementos:</b> emissor, receptor, mensagem, canal, código, contexto e feedback; ruído e barreiras.</li><li><b>Comunicação interna x externa; formal x informal.</b></li><li><b>Fluxos:</b> descendente, ascendente, horizontal e diagonal.</li><li><b>Escuta ativa, assertividade e feedback.</b></li><li><b>Qualidade no atendimento:</b> expectativa x percepção; momento da verdade.</li><li><b>Postura profissional:</b> pontualidade, sigilo, cordialidade, ética.</li><li><b>Inteligência emocional</b> (Goleman).</li></ul>`,
`<ol><li><b>Fluxos.</b> Uma ordem da diretoria à equipe é comunicação descendente; uma sugestão do assistente à gerência é ascendente; um pedido de informação entre duas áreas do mesmo nível é horizontal.</li><li><b>Barreira semântica.</b> O uso de sigla interna em e-mail a um cliente externo, sem explicar o significado, dificulta a compreensão.</li><li><b>Reclamação.</b> Um usuário reclama de cobrança indevida. O atendente ouve, registra o protocolo, informa o prazo de resposta e encaminha ao setor responsável; ao final, retorna ao usuário com a solução.</li></ol>`,
`<ul><li>Redigir e-mails e comunicados claros, objetivos e revisados.</li><li>Atender o público presencial, por telefone e meios eletrônicos com cortesia, registrando solicitações.</li><li>Manter sigilo sobre informações de usuários e da empresa.</li><li>Dar retorno aos prazos combinados e escalar corretamente o que foge de sua competência.</li></ul>`,
`<div class="tbl"><table><tr><th>Fluxo</th><th>Direção</th><th>Exemplo</th></tr><tr><td>Descendente</td><td>Chefia → equipe</td><td>Instruções, comunicados</td></tr><tr><td>Ascendente</td><td>Equipe → chefia</td><td>Relatórios, sugestões</td></tr><tr><td>Horizontal</td><td>Entre pares/áreas</td><td>Reuniões entre setores</td></tr><tr><td>Diagonal</td><td>Níveis e áreas diferentes</td><td>Assessoria a outra área</td></tr></table></div><div class="tbl"><table><tr><th>Estilo de comportamento</th><th>Característica</th></tr><tr><td>Passivo</td><td>Evita expor opinião</td></tr><tr><td>Agressivo</td><td>Impõe-se sem respeitar o outro</td></tr><tr><td>Assertivo</td><td>Expressa-se com clareza e respeito</td></tr></table></div>`,
`<ul><li>Feedback fecha o ciclo da comunicação.</li><li>Ruído é interferência; barreira é obstáculo à compreensão.</li><li>Comunicação formal segue os canais oficiais; a informal ocorre fora deles.</li><li>Qualidade percebida = expectativa comparada à percepção.</li><li>Sigilo e discrição fazem parte da postura profissional.</li></ul>`,
`<ul><li>Confundir canal (meio) com código (idioma/sinais).</li><li>Dizer que a comunicação informal deve ser eliminada: deve ser compreendida e administrada.</li><li>Confundir assertividade com agressividade.</li><li>Trocar fluxo ascendente por descendente.</li><li>Pensar que “o cliente sempre tem razão” autoriza desrespeito ao atendente: o foco é resolver com respeito mútuo.</li></ul>`,
`<p>A comunicação envolve emissor, receptor, mensagem, canal, código, contexto e feedback, e sofre ruídos e barreiras. Na organização, flui nas direções descendente, ascendente, horizontal e diagonal, pelos canais formais e informais. No trabalho, exige clareza, escuta ativa e assertividade. A qualidade no atendimento depende de expectativas e percepções do cliente. A postura profissional e as relações interpessoais sustentam a imagem da organização.</p>`,
`COMUNICAÇÃO E ATENDIMENTO
├─ Elementos: emissor, receptor, mensagem, canal, código, contexto, feedback | ruído e barreiras
├─ Corporativa: interna | externa; formal | informal
│  └─ Fluxos: descendente | ascendente | horizontal | diagonal
├─ No trabalho: clareza, escuta ativa, assertividade, feedback, e-mail e reunião
├─ Atendimento: expectativa x percepção, momento da verdade, reclamações, prioridade legal
└─ Postura profissional e relações interpessoais: ética, sigilo, empatia, inteligência emocional`,
[["No processo de comunicação, o retorno do receptor ao emissor que confirma a compreensão da mensagem é denominado:",["Ruído.","Canal.","Código.","Feedback.","Contexto."],3,"Feedback é o retorno que fecha o ciclo da comunicação. Ruído é interferência; canal é o meio; código é o conjunto de signos."],
["Uma sugestão elaborada por um assistente e encaminhada à gerência representa um fluxo de comunicação:",["Descendente.","Ascendente.","Horizontal.","Diagonal.","Informal necessariamente."],1,"Da base para o topo, a comunicação é ascendente. Descendente seria da chefia para a equipe."],
["O uso de siglas internas desconhecidas em uma comunicação a um cliente externo exemplifica uma barreira:",["Física.","Semântica.","Fisiológica.","De distância.","Tecnológica."],1,"Barreiras semânticas envolvem palavras e códigos que o receptor não domina, como jargões e siglas."],
["Em relação à qualidade no atendimento, é correto afirmar que o cliente avalia o serviço:",["Apenas pelo preço.","Comparando suas expectativas com o que percebeu do serviço.","Exclusivamente pelo resultado final, ignorando o modo de atender.","Apenas pela aparência das instalações.","Somente se houver reclamação formal."],1,"A qualidade percebida resulta da comparação entre expectativa e percepção, incluindo o modo de atender."],
["Expressar a própria posição com clareza e respeito aos direitos e opiniões do outro caracteriza o comportamento:",["Passivo.","Agressivo.","Assertivo.","Evasivo.","Manipulador."],2,"Assertividade equilibra firmeza e respeito. O passivo se cala; o agressivo se impõe."],
["Qual atitude é adequada diante de um usuário que apresenta uma reclamação?",["Interromper para explicar as regras.","Ouvir com atenção, demonstrar empatia, registrar e buscar solução ou encaminhamento.","Transferir a responsabilidade ao usuário.","Evitar o registro para não gerar problemas.","Discutir os argumentos apresentados."],1,"O bom atendimento ouve, é empático, registra e resolve ou encaminha, dando retorno ao usuário."]]]);
L.es6=mk("ES-6 · Administração de Materiais, Patrimônio e Logística","Cobre todos os assuntos do item 6 do Anexo III: administração de materiais, logística, compras e suprimentos, recebimento, armazenamento, distribuição, controle de estoque, inventário, patrimônio e controle de bens.",[
`<p><b>Administração de materiais</b> cuida do fluxo dos materiais, desde a necessidade até o consumo, buscando ter o item certo, na quantidade certa, no momento certo e com o menor custo. Seu ciclo envolve: planejamento e <b>compras e suprimentos</b> (requisição, cotação, seleção do fornecedor, pedido ou ordem de compra, acompanhamento), <b>recebimento</b>, <b>armazenamento</b>, <b>distribuição</b>, <b>controle de estoques</b> e <b>inventário</b>. As compras em órgãos e estatais seguem as regras de licitação (item 9 do edital).</p>
<p><b>Classificação de materiais.</b> A <b>curva ABC</b> ordena os itens por valor de consumo: a classe <b>A</b> reúne poucos itens que respondem pela maior parte do valor (exige controle rigoroso), a classe <b>B</b> é intermediária e a classe <b>C</b> reúne muitos itens de pouco valor (controle simplificado). Também se classificam por criticidade (importância para a operação) e por tipo (consumo, permanente, matéria-prima).</p>
<p><b>Controle de estoque.</b> Estoque é a quantidade de materiais armazenada. Principais parâmetros: <b>estoque mínimo ou de segurança</b> (proteção contra variações de consumo e atrasos), <b>tempo de reposição</b> (da emissão do pedido ao recebimento), <b>ponto de pedido</b> (nível em que se deve pedir: <i>consumo médio × tempo de reposição + estoque de segurança</i>), <b>lote de compra</b> e <b>estoque máximo</b> (<i>estoque mínimo + lote de compra</i>). O <b>lote econômico de compra</b> busca o tamanho de pedido de menor custo total. O <b>giro de estoque</b> é a relação entre o consumo e o estoque médio no período; a <b>cobertura</b> indica por quanto tempo o estoque atende ao consumo. Para saída e valoração: <b>PEPS</b> (primeiro que entra, primeiro que sai), <b>custo médio ponderado</b> e <b>UEPS</b> (último que entra, primeiro que sai), este último não aceito pela legislação fiscal brasileira. Para itens com validade, usa-se o <b>PVPS/FEFO</b> (primeiro que vence, primeiro que sai).</p>
<p><b>Recebimento.</b> É a etapa em que se confere o material recebido: confronto entre pedido de compra, nota fiscal e material, com <b>conferência quantitativa</b> (quantidade) e <b>qualitativa</b> (especificações, condições, validade), registro de divergências e aceite ou recusa. <b>Armazenamento</b>: local adequado, endereçamento dos itens, organização por critérios (giro, tamanho, afinidade), segurança, higiene e condições (temperatura, umidade). <b>Distribuição</b>: atendimento das requisições dos setores, com registro de saída e entrega ao solicitante.</p>
<p><b>Inventário</b> é a contagem física dos itens para conferir com os registros. Pode ser <b>geral</b> (todos os itens em data definida, geralmente anual), <b>rotativo ou cíclico</b> (parte dos itens ao longo do ano) ou por amostragem. As diferenças são apuradas, justificadas e ajustadas.</p>
<p><b>Patrimônio e controle de bens.</b> Bens permanentes mantêm sua identidade física e têm vida útil longa; materiais de consumo se esgotam ou perdem a identidade com o uso (os critérios exatos variam conforme a norma da entidade). O controle patrimonial envolve: <b>cadastro e tombamento</b> (registro e identificação do bem, com plaqueta ou etiqueta), <b>termo de responsabilidade</b> (quem usa responde pelo bem), <b>movimentação</b> (transferência entre setores com registro), <b>baixa</b> (saída do patrimônio por alienação, doação, perda, inservibilidade etc.) e <b>depreciação</b> (perda de valor pelo uso, desgaste ou obsolescência). Realiza-se inventário patrimonial periódico para conferir a existência e a localização dos bens.</p>
<p><b>Logística</b> é o planejamento, a execução e o controle do fluxo e do armazenamento de bens, serviços e informações do ponto de origem ao de consumo. Abrange a logística de suprimento (abastecimento), interna e de distribuição, e a <b>logística reversa</b> (retorno de materiais ao ciclo, como descarte e reciclagem). Os modais de transporte são rodoviário, ferroviário, aquaviário, aéreo e dutoviário.</p>`,
`<ul><li><b>Ciclo:</b> compras → recebimento → armazenamento → distribuição → controle → inventário.</li><li><b>Curva ABC:</b> A = poucos itens, maior valor; C = muitos itens, menor valor.</li><li><b>Ponto de pedido</b> = consumo médio × tempo de reposição + estoque de segurança.</li><li><b>Estoque máximo</b> = estoque mínimo + lote de compra.</li><li><b>PEPS, custo médio e UEPS</b> (UEPS não aceito fiscalmente no Brasil); <b>FEFO</b> para itens com validade.</li><li><b>Tombamento, termo de responsabilidade, movimentação, baixa e depreciação.</b></li><li><b>Inventário:</b> geral, rotativo/cíclico.</li><li><b>Logística reversa</b> e modais.</li></ul>`,

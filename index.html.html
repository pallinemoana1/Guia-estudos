function cronWire(){S.cr=S.cr||{};function pg(){var k=Object.keys(S.cr).filter(function(x){return S.cr[x]}).length;document.getElementById("pb").style.width=(k/CR.length*100)+"%";document.getElementById("pt2").textContent=k+" de "+CR.length+" blocos concluídos"}

var rm=document.getElementById("rm");function lb(){rm.textContent=S.al?"🔔 Lembretes ligados (clique para desligar)":"🔕 Ativar lembretes"}lb();
rm.onclick=function(){S.al=!S.al;save();if(S.al){try{Notification.requestPermission()}catch(e){}startT();tick()}else{clearInterval(ti);ti=null}lb()};
document.getElementById("ts").onclick=function(){try{Notification.requestPermission()}catch(e){}ping("Lembrete de teste","É assim que o aviso de estudo vai aparecer.")};pg()}
function ping(t,b){var o=document.getElementById("toast");if(o)o.remove();var d=document.createElement("div");d.id="toast";d.setAttribute("role","alert");d.style.cssText="position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));max-width:560px;margin:auto;background:var(--pr);color:#fff;padding:12px 14px;border-radius:10px;z-index:9;cursor:pointer;box-shadow:0 4px 16px rgba(0,0,0,.3)";d.innerHTML="<b>⏰ "+t+"</b><br>"+b;d.onclick=function(){d.remove()};document.body.appendChild(d);setTimeout(function(){d.remove()},3e4);try{if(window.Notification&&Notification.permission==="granted")new Notification(t,{body:b})}catch(e){}}
function tick(){var n=new Date();CR.forEach(function(r,i){var df=ts(r,1)-n;if(df<=3e5&&df>-6e4&&!sent[i]&&!(S.cr||{})[i]){sent[i]=1;ping("Estudo em "+Math.max(0,Math.round(df/6e4))+" min: "+r[3],r[4])}});var e=document.getElementById("now");if(e)e.innerHTML=nowCard()}
function startT(){if(!ti)ti=setInterval(tick,3e4)}
var TG=[["pt",1],["es",1],["rl",0],["in",3],["rl",2],["rev",-1],["pt",0],["es",2],["cg",0],["pt",3],["es",1],["rl",4],["in",1],["pt",0],["es",-1],["cg",-1],["in",1],["rl",-1],["cg",2],["es",-1],["pt",1],["home",-1],["rev",-1],["es",-1],["in",-1],["cg",-1],["rl",-1],["pt",-1],["home",-1],["rev",-1]];
function go(i){var t=TG[i],id=t[0],ix=t[1],rev=0,el=null;
if(id=="rev"){rev=1;id="pt";var f=0;M.forEach(function(m){if(m.q&&!f){var a=S[m.id]||{};for(var k in a)if(a[k]!==m.q[k][2]){f=1;id=m.id;break}}})}
cur=id;draw();var m=M.filter(function(x){return x.id==id})[0];
if(ix>=0){el=document.querySelectorAll("details")[ix];if(el)el.open=true}
else if(m&&m.q){var a=S[m.id]||{},k=0,j;if(rev){for(j in a)if(a[j]!==m.q[j][2]){k=+j;break}}else{for(j=0;j<m.q.length;j++)if(a[j]===undefined){k=j;break}}el=document.getElementById("q"+k)}
if(el){el.scrollIntoView({behavior:"smooth",block:"start"});el.style.outline="2px solid var(--pr)";setTimeout(function(){el.style.outline=""},3e3)}else scrollTo(0,0)}
document.addEventListener("click",function(e){var a=e.target.closest&&e.target.closest("[data-go]");if(a){e.preventDefault();go(+a.dataset.go)}});
if(S.al)startT();
draw();
</script></body></html>
